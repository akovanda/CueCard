x-cuecard-env: &cuecard-env
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
  RERANK_WEIGHT: ${RERANK_WEIGHT:-0.1}
  RETRIEVAL_OVERFETCH: ${RETRIEVAL_OVERFETCH:-8}
  VOTE_BOOST_WEIGHT: ${VOTE_BOOST_WEIGHT:-1.0}
  USAGE_BOOST_WEIGHT: ${USAGE_BOOST_WEIGHT:-0.01}
  USAGE_BOOST_TTL_DAYS: ${USAGE_BOOST_TTL_DAYS:-14}
  WORKER_POLL_SEC: ${WORKER_POLL_SEC:-2}
  WORKER_BATCH: ${WORKER_BATCH:-32}
  WORKER_LEASE_SEC: ${WORKER_LEASE_SEC:-300}
  CLEANUP_INTERVAL_SEC: ${CLEANUP_INTERVAL_SEC:-3600}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  CUECARD_API_KEY: ${CUECARD_API_KEY:?set CUECARD_API_KEY}
  API_KEY_HEADER: ${API_KEY_HEADER:-X-API-Key}
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://ctx:ctx@db:5432/ctx}

services:
  cuecard-api:
    image: ghcr.io/your-org/cuecard:0.2
    command: ["uvicorn", "app.server:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *cuecard-env
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  cuecard-worker:
    image: ghcr.io/your-org/cuecard:0.2
    command: ["python", "-m", "app.worker"]
    environment: *cuecard-env
    restart: unless-stopped
    healthcheck:
      disable: true
