
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cuecard
spec:
  replicas: 1
  selector:
    matchLabels: { app: cuecard }
  template:
    metadata:
      labels: { app: cuecard }
    spec:
      containers:
        - name: cuecard
          image: ghcr.io/your-org/cuecard:0.2
          ports: [{ containerPort: 8000 }]
          env:
            - name: EMBEDDING_PROVIDER
              value: "local"
          livenessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 10 }
          readinessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 5 }
---
apiVersion: v1
kind: Service
metadata:
  name: cuecard
spec:
  selector: { app: cuecard }
  ports: [{ port: 8000, targetPort: 8000 }]
