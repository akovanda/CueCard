name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Build and start services
        run: |
          docker compose up -d --build

      - name: Wait for API
        run: |
          for i in {1..60}; do
            if curl -sS http://localhost:8000/health | grep -q '"ok": true'; then
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time" >&2
          docker compose ps
          docker compose logs api db | tail -n 500
          exit 1

      - name: Run tests
        run: |
          docker compose exec -T api pytest -v

      - name: Show service logs on failure
        if: failure()
        run: |
          docker compose logs api db | tail -n 1000
