name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Build and start services
        run: |
          docker compose up -d --build

      - name: Wait for API
        shell: bash
        run: |
          for i in {1..90}; do
            # First, try hitting the API directly. If it responds ok:true, we're good.
            if curl -fsS --retry 3 --retry-all-errors http://localhost:8000/health | grep -q '"ok":[[:space:]]*true'; then
              echo "API is reachable and healthy"
              exit 0
            fi
            # Fallback to container health as a secondary signal
            CID=$(docker compose ps -q api)
            if [[ -n "$CID" ]]; then
              STATUS=$(docker inspect -f '{{.State.Health.Status}}' "$CID" || echo "unknown")
            else
              STATUS="unknown"
            fi
            if [[ "$STATUS" == "healthy" ]]; then
              echo "API container marked healthy"
              exit 0
            elif [[ "$STATUS" == "starting" ]]; then
              echo "API container starting; proceeding to tests"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time" >&2
          docker compose ps
          docker compose logs api db | tail -n 500
          exit 1

      - name: Run tests with coverage
        run: |
          docker compose exec -T api bash -lc 'mkdir -p /tmp/coverage && export COVERAGE_FILE=/tmp/coverage/.coverage && pytest -v'
          docker compose cp api:/tmp/coverage/coverage.xml coverage.xml || true

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

      - name: Show service logs on failure
        if: failure()
        run: |
          docker compose logs api db | tail -n 1000

  publish:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE_NAME: cuecard
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ env.OWNER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

