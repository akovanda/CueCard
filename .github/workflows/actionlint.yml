name: Actionlint

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Lint workflows
        uses: rhysd/actionlint@03d0035246f3e81f36aed592ffb4bebf33a03106
