name: Trivy Container Scan

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Build API image (local)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: ./api
          file: ./api/Dockerfile
          tags: local/cuecard:ci
          load: true

      - name: Prepare Trivy cache
        run: mkdir -p "$RUNNER_TEMP/trivy-cache"

      - name: Generate Trivy SARIF report
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            -v "$PWD:/work" \
            aquasec/trivy:0.65.0@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 image \
            --cache-dir /root/.cache/trivy \
            --format sarif \
            --output /work/trivy-results.sarif \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            local/cuecard:ci

      - name: Upload SARIF results
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Enforce Trivy severity gate
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            aquasec/trivy:0.65.0@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 image \
            --cache-dir /root/.cache/trivy \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            local/cuecard:ci
