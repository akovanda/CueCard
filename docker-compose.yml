services:
  db:
    image: pgvector/pgvector:pg16
    env_file: .env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ctx} -d ${POSTGRES_DB:-ctx}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - dbdata:/var/lib/postgresql/data

  migrations:
    build:
      context: ./api
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  api:
    build:
      context: ./api
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_started
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./examples:/data

volumes:
  dbdata:
