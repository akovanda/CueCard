x-api-build: &api-build
  context: ./api
  args:
    INSTALL_DEV: "true"

services:
  db:
    image: pgvector/pgvector:pg17
    env_file: .env
    # No host port mapping by default to avoid conflicts. Use an override file if you need access from host.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ctx} -d ${POSTGRES_DB:-ctx}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - dbdata:/var/lib/postgresql/data

  migrations:
    build: *api-build
    env_file: .env
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  api:
    build: *api-build
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    command: ["uvicorn", "app.server:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./api:/app
      - ./examples:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "/app/app/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build: *api-build
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    command: ["python", "-m", "app.worker"]
    volumes:
      - ./api:/app
      - ./examples:/data
    restart: unless-stopped
    healthcheck:
      disable: true

volumes:
  dbdata:
