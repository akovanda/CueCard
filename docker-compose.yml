services:
  db:
    image: pgvector/pgvector:pg17
    env_file: .env
    # No host port mapping by default to avoid conflicts. Use an override file if you need access from host.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ctx} -d ${POSTGRES_DB:-ctx}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - dbdata:/var/lib/postgresql/data

  migrations:
    build:
      context: ./api
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  api:
    build:
      context: ./api
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_started
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./api:/app
      - ./examples:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  dbdata:
