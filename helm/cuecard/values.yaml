image:
  repository: ghcr.io/akovanda/cuecard
  tag: "0.2"
  pullPolicy: IfNotPresent

api:
  replicas: 1
  resources: {}

worker:
  replicas: 1
  resources: {}

service:
  type: ClusterIP
  port: 8000

env:
  EMBEDDING_PROVIDER: "local"
  EMBEDDING_MODEL: "text-embedding-3-small"
  RERANK_WEIGHT: 0.1
  RETRIEVAL_OVERFETCH: 8
  VOTE_BOOST_WEIGHT: 1.0
  USAGE_BOOST_WEIGHT: 0.01
  USAGE_BOOST_TTL_DAYS: 14
  WORKER_POLL_SEC: 2
  WORKER_BATCH: 32
  WORKER_LEASE_SEC: 300
  CLEANUP_INTERVAL_SEC: 3600
  CORS_ORIGINS: ""

secretEnv:
  DATABASE_URL: ""         # required
  OPENAI_API_KEY: ""       # set for openai provider
  CUECARD_API_KEY: ""      # required

security:
  apiKeyHeaderName: "X-API-Key"

podAnnotations: {}

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: []
