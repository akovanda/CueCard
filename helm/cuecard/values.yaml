
image:
  repository: ghcr.io/your-org/cuecard
  tag: "0.2"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

resources: {}
#  limits:
#    cpu: 500m
#    memory: 512Mi
#  requests:
#    cpu: 100m
#    memory: 128Mi

env:
  EMBEDDING_PROVIDER: "local"
  EMBEDDING_MODEL: "text-embedding-3-small"
  EMBEDDING_DIM: 1536
  RERANK_WEIGHT: 0.1
  RETRIEVAL_OVERFETCH: 8
  WORKER_POLL_SEC: 2
  WORKER_BATCH: 32
  # DATABASE_URL defaults to in-cluster service name "db" if you deploy Postgres alongside.
  DATABASE_URL: ""

secretEnv:
  OPENAI_API_KEY: ""       # set for openai provider
  CUECARD_API_KEY: ""      # optional: enable simple header auth

security:
  apiKeyHeaderName: "X-API-Key"

podAnnotations: {}

nodeSelector: {}
tolerations: []
affinity: []
